server.port=8083
spring.application.name=order-service
spring.config.import=optional:file:${user.home}/.foodflow/order-service.properties
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:postgresql://localhost:5432/foodflow_orders
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
foodflow.razorpay.key-id=${RAZORPAY_KEY_ID:}
foodflow.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
foodflow.razorpay.api-url=${RAZORPAY_API_URL:https://api.razorpay.com}
springdoc.swagger-ui.path=/swagger-ui.html
