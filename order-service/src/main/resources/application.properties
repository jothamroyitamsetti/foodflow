server.port=8083
spring.application.name=order-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=foodflow
spring.datasource.password=foodflow
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
foodflow.jwt.secret=${JWT_SECRET:foodflow-local-development-secret-key-change-before-production}
foodflow.internal-token=${INTERNAL_TOKEN:foodflow-local-internal-token-change-before-production}
management.endpoints.web.exposure.include=health,info
