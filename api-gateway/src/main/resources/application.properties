server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:file:${user.home}/.foodflow/api-gateway.properties

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalog/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=delivery-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/deliveries/**

spring.cloud.gateway.server.webflux.routes[4].id=coupon-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://COUPON-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/coupons/**

spring.cloud.gateway.server.webflux.routes[5].id=review-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/reviews/**

foodflow.jwt.secret=${JWT_SECRET}
spring.main.web-application-type=reactive


# Centralized Swagger UI: one UI aggregates OpenAPI docs from all business services
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

#here we are disabling default routing for swagger and giving our own
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Catalog Service
springdoc.swagger-ui.urls[1].url=/catalog/v3/api-docs
springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/orders/v3/api-docs
springdoc.swagger-ui.urls[3].name=Delivery Service
springdoc.swagger-ui.urls[3].url=/delivery/v3/api-docs
springdoc.swagger-ui.urls[4].name=Coupon Service
springdoc.swagger-ui.urls[4].url=/coupon/v3/api-docs
springdoc.swagger-ui.urls[5].name=Review Service
springdoc.swagger-ui.urls[5].url=/review/v3/api-docs
# Route OpenAPI requests through the gateway to each service

spring.cloud.gateway.server.webflux.routes[6].id=auth-service-openapi
spring.cloud.gateway.server.webflux.routes[6].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[7].id=catalog-service-openapi
spring.cloud.gateway.server.webflux.routes[7].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/catalog/v3/api-docs
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[8].id=order-service-openapi
spring.cloud.gateway.server.webflux.routes[8].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/orders/v3/api-docs
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[9].id=delivery-service-openapi
spring.cloud.gateway.server.webflux.routes[9].uri=lb://DELIVERY-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/delivery/v3/api-docs
spring.cloud.gateway.server.webflux.routes[9].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[10].id=coupon-service-openapi
spring.cloud.gateway.server.webflux.routes[10].uri=lb://COUPON-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/coupon/v3/api-docs
spring.cloud.gateway.server.webflux.routes[10].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[11].id=review-service-openapi
spring.cloud.gateway.server.webflux.routes[11].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/review/v3/api-docs
spring.cloud.gateway.server.webflux.routes[11].filters[0]=StripPrefix=1
