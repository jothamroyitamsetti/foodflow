server.port=8081
spring.application.name=auth-service

spring.config.import=optional:file:${user.home}/.foodflow/auth-service.properties,optional:file:${user.home}/.foodflow/auth-admin-bootstrap.properties

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:postgresql://localhost:5432/foodflow_auth
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
foodflow.jwt.secret=${JWT_SECRET}
foodflow.jwt.access-token-expiration-seconds=43200
springdoc.swagger-ui.path=/swagger-ui.html
